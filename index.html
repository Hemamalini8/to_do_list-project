<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.c
ss"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="flex justify-center items-center mt-2 bg-gray-50 mx-auto p-4">
      <div class="text-center w-full max-w-md p-6 ">
        <h1 class="text-3xl font-bold mb-8 text-green-600">
          Registration Form
        </h1>
        <form class="space-y-3">
          <div>
            <label class="block text-left text-xl rounded-md font-semibold">Name</label>
            <input
              id="input"
              type="text"
              placeholder="Enter your Name"
              class=" rounded-md border border-gray-600 w-full mt-2 p-2 text-lg"
            />
          </div>
          <div>
            <label class="block text-left text-xl rounded-md font-semibold">Age</label>
            <input
              type="number"
              placeholder="Enter your Age"
              id="age"
              class="border border-gray-600 rounded-md w-full mt-2 p-2 text-lg"
            />
          </div>
          <div>
            <label class="block text-left text-xl font-semibold">Email</label>
            <input
              type="email"
              placeholder="Enter your Email"
              id="email"
              class="border border-gray-600 rounded-md w-full mt-2 p-2 text-lg "
            />
          </div>
          <div>
            <label class="block text-left text-xl  rounded-md font-semibold"
              >Password</label
            >
            <input
              type="password"
              placeholder="Enter your Password"
              id="pw"
              minlength="6"
              class="border border-gray-600 rounded-md w-full mt-2 p-2 text-lg "
            />
          </div>
          <div id="gender">
            <label class="block text-left text-xl font-semibold">Gender</label>
            <div
              class="flex flex-col sm:flex-row justify-center gap-6 mt-2 text-lg"
            >
              <label>
                <input
                  type="radio"
                  name="Gender"
                  value="Male"
                  class="mr-2"
                />
                Male
              </label>
              <label>
                <input
                  type="radio"
                  name="Gender"
                  value="Female"
                  class="mr-2"
                />
                Female</label
              >
            </div>
          </div>
          <div>
            <label class="block text-left text-xl font-semibold mt2"
              >Courses</label
            >
            <select
              id="course"
              required
              class=" rounded-lg border border-black p-2 wfull mt-2"
            >
              <option>EMC Courses</option>
              <option>Fullstack web development</option>
              <option>UI/UX Design</option>
              <option>Devops</option>
              <option>DSA</option>
              <option>Prompt Engineer</option>
            </select>
          </div>
          <div>
            <button
              type="button"
              id="btn"
              class="mt-8 p-2 font-bold bg-green-500 w-full text-xl rounded hover:bg-green-600 transition"
              style="width: 60%"
            >
              Register
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class=" flex p-5 mt-8 justify-center">
      <div class="  w-full overflow-x-auto">
        <table class=" min-w-full text-center text-xl">
          <thead>
            <h1 class="text-center text-3xl mt-5 mb-5 font-bold text-green-600 ">
              Register student List
            </h1>
            <tr>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Name</th>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Age</th>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Email</th>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Password</th>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Gender</th>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Courses</th>
              <th class=" rounded-lg border border-gray-600 bg-gray-300 p-3">Action</th>
            </tr>
          </thead>
          <tbody id="container">
            <tr>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
